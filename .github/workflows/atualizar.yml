- name: Salvar dados.json no repositório
        run: |
          git config user.name  "Bot Grow Label"
          git config user.email "bot@growlabel.com.br"
          git pull --rebase origin main
          git add dados.json
          if git diff --staged --quiet; then
            echo "Sem alterações nos dados — nenhum commit necessário."
          else
            TS_BRT=$(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')
            git commit -m "📊 Dados atualizados — ${TS_BRT} BRT"
            git push
            echo "✅ dados.json atualizado com sucesso!"
          fi
