<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produção – Grow Label</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#1a1d2e;--bg3:#21253a;
  --accent:#00cba0;--text:#e2e8f0;--dim:#94a3b8;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;
  --border:rgba(255,255,255,0.07);--r:12px;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
#app{display:flex;flex-direction:column;width:100vw;height:100vh}

/* Header */
#hdr{height:60px;background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;overflow:hidden}
#hdr h1{font-size:17px;font-weight:700;color:var(--accent);white-space:nowrap;flex-shrink:0}
.sep{width:1px;height:28px;background:var(--border);flex-shrink:0}
.cl{color:var(--dim);font-size:11px;white-space:nowrap}
select,input[type=date]{background:var(--bg3);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:5px 8px;font-size:12px;cursor:pointer;min-width:0}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.hsp{flex:1}
#ua{color:var(--dim);font-size:11px;white-space:nowrap;flex-shrink:0}

/* Tabs */
#tabs{height:44px;background:var(--bg2);display:flex;align-items:center;gap:2px;
  padding:0 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:6px 16px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;
  color:var(--dim);transition:all .15s;border:none;background:transparent;white-space:nowrap}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab.active{color:var(--accent);background:rgba(0,203,160,.12);font-weight:700}

/* Content */
#cont{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;
  display:flex;flex-direction:column;gap:10px}

/* KPI row */
#kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex-shrink:0}
.kc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px}
.kl{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kv{font-size:22px;font-weight:800;line-height:1.1}
.ks{font-size:10px;color:var(--dim);margin-top:3px}

/* Chart cards */
.cc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  padding:12px;display:flex;flex-direction:column}
.ct{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px;flex-shrink:0}
.cw{position:relative}
canvas{display:block}

/* Charts grid */
#cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cg .cc .cw{height:240px}
#cm .cw{height:280px}

/* Badge */
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700}
.bg{background:rgba(34,197,94,.15);color:var(--green)}
.by{background:rgba(234,179,8,.15);color:var(--yellow)}
.br{background:rgba(239,68,68,.15);color:var(--red)}

/* Spinner */
#spin{position:fixed;inset:0;z-index:999;background:rgba(15,17,23,.9);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--accent)}

@media(max-width:900px){
  #kpi{grid-template-columns:repeat(2,1fr)}
  #cg{grid-template-columns:1fr}
}
@media(max-width:600px){
  .tab{padding:5px 10px;font-size:11px}
  #hdr h1{font-size:14px}
  #kpi{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="spin">⏳ Carregando dados...</div>

<div id="app">
  <header id="hdr">
    <h1>📊 Grow Label – Produção</h1>
    <div class="sep"></div>
    <span class="cl">Mês:</span>
    <select id="sMes"></select>
    <div class="sep"></div>
    <span class="cl">De:</span>
    <input type="date" id="dIni">
    <span class="cl">Até:</span>
    <input type="date" id="dFim">
    <div class="hsp"></div>
    <span id="ua">–</span>
  </header>

  <nav id="tabs">
    <button class="tab active" data-aba="Geral">Geral</button>
    <button class="tab" data-aba="Flexografia">Flexografia</button>
    <button class="tab" data-aba="Digital">Digital</button>
    <button class="tab" data-aba="Polly">Polly</button>
    <button class="tab" data-aba="Insert">Insert</button>
    <button class="tab" data-aba="Revisão">Revisão</button>
  </nav>

  <main id="cont">
    <div id="kpi">
      <div class="kc">
        <div class="kl">Produção Total</div>
        <div class="kv" id="kM">–</div>
        <div class="ks" id="kP">–</div>
      </div>
      <div class="kc">
        <div class="kl">Meta do Período</div>
        <div class="kv" id="kMt">–</div>
        <div class="ks">metros lineares esperados</div>
      </div>
      <div class="kc">
        <div class="kl">Performance</div>
        <div class="kv" id="kPf">–</div>
        <div class="ks" id="kSt">–</div>
      </div>
      <div class="kc">
        <div class="kl">Média M/H</div>
        <div class="kv" id="kMH">–</div>
        <div class="ks" id="kMC">–</div>
      </div>
    </div>

    <div id="cg">
      <div class="cc">
        <div class="ct">Produção Diária (M/L)</div>
        <div class="cw"><canvas id="cDia"></canvas></div>
      </div>
      <div class="cc">
        <div class="ct">Produção por Máquina (M/L)</div>
        <div class="cw"><canvas id="cMensal"></canvas></div>
      </div>
    </div>

    <div class="cc" id="cm">
      <div class="ct">Desempenho por Máquina – Produzido vs Meta (M/L)</div>
      <div class="cw"><canvas id="cMaq"></canvas></div>
    </div>
  </main>
</div>

<script>
Chart.register(ChartDataLabels);

/* ── Helpers ──────────────────────────────────────────────── */
function n2(n) {
  if (n == null || isNaN(n)) return '–';
  if (n >= 1e6) return (n/1e6).toFixed(2).replace('.',',')+' MM/L';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace('.',',')+' K M/L';
  return Math.round(n).toLocaleString('pt-BR')+' M/L';
}
function fN(n) { return Math.round(n||0).toLocaleString('pt-BR'); }
function pC(p) { return p>=100?'#22c55e':p>=80?'#eab308':'#ef4444'; }
function pB(p) { return p>=100?'bg':p>=80?'by':'br'; }
function pL(p) { return p>=100?'✅ Acima da meta':p>=80?'⚠️ Próximo da meta':'🔴 Abaixo da meta'; }

Chart.defaults.color = '#94a3b8';
Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
Chart.defaults.font.family = "'Segoe UI',system-ui,sans-serif";

/* ── Estado ──────────────────────────────────────────────── */
var D=null, abaA='Geral', mesA=null, dI=null, dF=null, CH={};

function chrt(id, cfg) {
  if (CH[id]) { CH[id].destroy(); delete CH[id]; }
  var el = document.getElementById(id);
  if (!el) return;
  CH[id] = new Chart(el.getContext('2d'), cfg);
}

/* ── Render principal ────────────────────────────────────── */
function render() {
  if (!D || !mesA) return;
  var mes = D.meses[mesA]; if (!mes) return;
  var ab  = mes.abas[abaA]; if (!ab) return;

  /* Filtro de período */
  var diasFull = ab.por_dia || [];
  var dias = diasFull.filter(function(d) {
    if (dI && d.data < dI) return false;
    if (dF && d.data > dF) return false;
    return true;
  });

  var totDias = diasFull.length || 1;
  var selDias = dias.length || 1;
  var frac = selDias / totDias;

  /* Máquinas filtradas proporcionalmente */
  var mqs = (ab.por_maquina || []).map(function(m) {
    if (!dI && !dF) return m;
    var mDias = (m.por_dia || []).filter(function(d) {
      if (dI && d.data < dI) return false;
      if (dF && d.data > dF) return false;
      return true;
    });
    var metros = mDias.reduce(function(s,d){return s+(d.metros||0);},0);
    var meta_metros = Math.round((m.meta_metros||0) * frac);
    var pct = meta_metros > 0 ? +((metros/meta_metros)*100).toFixed(1) : 0;
    return Object.assign({}, m, {metros:Math.round(metros), meta_metros:meta_metros, performance_pct:pct});
  }).filter(function(m){ return m.metros > 0; });

  var totM  = dias.reduce(function(s,d){return s+(d.metros||0);},0);
  var metaT = mqs.reduce(function(s,m){return s+(m.meta_metros||0);},0);
  var totMin = (ab.total_minutos||0) * frac;
  var mhMed = totMin > 0 ? Math.round(totM/(totMin/60)) : 0;
  var perf  = metaT > 0 ? +((totM/metaT)*100).toFixed(1) : 0;

  /* KPIs */
  document.getElementById('kM').textContent  = n2(totM);
  document.getElementById('kMt').textContent = n2(metaT);
  document.getElementById('kP').textContent  = (mes.periodo.inicio||'')+(mes.periodo.inicio?' → ':''+(mes.periodo.fim||''));
  document.getElementById('kMH').textContent = fN(mhMed)+' m/h';
  document.getElementById('kMC').textContent = mqs.length+' máquinas ativas';
  var pfEl = document.getElementById('kPf');
  pfEl.textContent = perf+'%'; pfEl.style.color = pC(perf);
  document.getElementById('kSt').innerHTML = '<span class="badge '+pB(perf)+'">'+pL(perf)+'</span>';

  rDiario(dias);
  rMensal(mqs);
  rDesempenho(mqs);
}

/* ── Gráfico: Produção diária ────────────────────────────── */
function rDiario(dias) {
  if (!dias.length) return;
  var labels = dias.map(function(d){return d.data.slice(5).replace('-','/');});
  var vals   = dias.map(function(d){return d.metros||0;});
  var avg    = vals.reduce(function(a,b){return a+b;},0)/(vals.length||1);

  chrt('cDia', {
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label:'Metros Lineares',
        data:vals,
        backgroundColor:vals.map(function(v){return v>=avg?'rgba(34,197,94,0.65)':'rgba(0,203,160,0.5)';}),
        borderRadius:4,
        datalabels:{display:false}
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        datalabels:{display:false},
        tooltip:{callbacks:{label:function(c){return ' '+fN(c.parsed.y)+' M/L';}}}
      },
      scales:{
        x:{grid:{display:false}, ticks:{maxRotation:60, font:{size:9}}},
        y:{ticks:{callback:function(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v;}}}
      }
    }
  });
}

/* ── Gráfico: Produção por máquina (mensal) ─────────────── */
function rMensal(mqs) {
  var top = mqs.slice(0,10);
  if (!top.length) return;
  var labels = top.map(function(m){return m.maquina.replace(/^\d+\s*-\s*/,'').slice(0,16);});
  var vals   = top.map(function(m){return m.metros;});

  chrt('cMensal', {
    type:'bar',
    data:{
      labels:labels,
      datasets:[{
        label:'Metros Produzidos',
        data:vals,
        backgroundColor:top.map(function(m){return pC(m.performance_pct)+'bb';}),
        borderRadius:5,
        datalabels:{
          anchor:'end', align:'top', offset:2,
          font:{size:9,weight:'600'}, color:'#e2e8f0',
          formatter:function(v){
            return v>=1e6?(v/1e6).toFixed(2).replace('.',',')+' MM':v>=1e3?Math.round(v/1e3)+'K':Math.round(v);
          }
        }
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{label:function(c){return ' '+fN(c.parsed.y)+' M/L';}}}
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:9}}},
        y:{ticks:{callback:function(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v;}}}
      }
    }
  });
}

/* ── Gráfico: Desempenho produzido vs meta ──────────────── */
function rDesempenho(mqs) {
  var top = mqs.slice(0,14);
  if (!top.length) return;
  var labels   = top.map(function(m){return m.maquina.replace(/^\d+\s*-\s*/,'').slice(0,20);});
  var prodVals = top.map(function(m){return m.metros;});
  var metaVals = top.map(function(m){return m.meta_metros;});
  var colors   = top.map(function(m){return pC(m.performance_pct)+'bb';});

  chrt('cMaq', {
    type:'bar',
    data:{
      labels:labels,
      datasets:[
        {
          label:'Meta',
          data:metaVals,
          backgroundColor:'rgba(100,116,139,0.25)',
          borderColor:'rgba(100,116,139,0.5)',
          borderWidth:1, borderRadius:4, order:2,
          datalabels:{
            anchor:'end', align:'end', offset:2,
            font:{size:8}, color:'#64748b',
            formatter:function(v){return fN(v);}
          }
        },
        {
          label:'Produzido',
          data:prodVals,
          backgroundColor:colors,
          borderRadius:4, order:1,
          datalabels:{
            anchor:'end', align:'start', offset:4,
            font:{size:10,weight:'700'},
            color:function(ctx){
              var y = ctx.parsed ? ctx.parsed.y : null;
              if (y == null) return '#00cba0';
              var mq = top[ctx.dataIndex];
              return mq ? pC(mq.performance_pct) : '#00cba0';
            },
            textStrokeColor:'rgba(0,0,0,0.65)', textStrokeWidth:2,
            formatter:function(value, ctx){
              var mq = top[ctx.dataIndex];
              if (!mq) return '';
              return [fN(value)+' M/L', mq.performance_pct+'%'];
            }
          }
        }
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{position:'top', labels:{boxWidth:12, font:{size:11}}},
        tooltip:{
          callbacks:{
            label:function(ctx){
              var mq = top[ctx.dataIndex];
              if (!mq) return '';
              if (ctx.datasetIndex===0) return ' Meta: '+fN(ctx.parsed.y)+' M/L';
              return ' Produzido: '+fN(ctx.parsed.y)+' M/L ('+mq.performance_pct+'%)';
            }
          }
        }
      },
      scales:{
        x:{grid:{display:false}, ticks:{font:{size:9}}},
        y:{ticks:{callback:function(v){return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v;}}}
      }
    }
  });
}

/* ── Carregar dados ──────────────────────────────────────── */
function load() {
  fetch('dados.json?t='+Date.now())
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      D = data;
      var sel = document.getElementById('sMes');
      sel.innerHTML = '';
      var meses = (D.meses_disponiveis || Object.keys(D.meses||{})).slice().sort().reverse();
      meses.forEach(function(m){
        var o = document.createElement('option');
        o.value = m;
        o.textContent = (D.meses[m] && D.meses[m].label) ? D.meses[m].label : m;
        sel.appendChild(o);
      });
      if (!mesA || !D.meses[mesA]) mesA = meses[0];
      sel.value = mesA;
      resetDatas();

      var ua = D.ultima_atualizacao || '';
      if (ua) {
        var dt = new Date(ua);
        document.getElementById('ua').textContent =
          'Atualizado: '+dt.toLocaleDateString('pt-BR')+' '+
          dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      }
      document.getElementById('spin').style.display = 'none';
      render();
    })
    .catch(function(e){
      document.getElementById('spin').textContent = '❌ Erro: '+e.message;
    });
}

function resetDatas() {
  if (!D || !mesA) return;
  var dias = (D.meses[mesA] && D.meses[mesA].abas && D.meses[mesA].abas.Geral)
             ? (D.meses[mesA].abas.Geral.por_dia||[]) : [];
  if (dias.length) {
    dI = dias[0].data;
    dF = dias[dias.length-1].data;
    document.getElementById('dIni').value = dI;
    document.getElementById('dFim').value = dF;
  } else { dI = dF = null; }
}

/* ── Eventos ─────────────────────────────────────────────── */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    abaA = t.dataset.aba;
    render();
  });
});

document.getElementById('sMes').addEventListener('change', function(){
  mesA = this.value;
  resetDatas();
  render();
});

document.getElementById('dIni').addEventListener('change', function(){
  dI = this.value || null;
  render();
});

document.getElementById('dFim').addEventListener('change', function(){
  dF = this.value || null;
  render();
});

load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
